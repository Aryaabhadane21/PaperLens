services:
  - type: web
    name: paperlens-assistant
    runtime: node
    plan: free
    region: oregon
    rootDir: research ai assistant
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: LLM_MOCK
        value: false
